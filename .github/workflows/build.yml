name: Build IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project GoalPilot.xcodeproj -scheme GoalPilot
          -configuration Debug -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/GoalPilot.app Payload/
          zip -r GoalPilot.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GoalPilot-ipa
          path: GoalPilot.ipa
