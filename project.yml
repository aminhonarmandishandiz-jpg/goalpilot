name: GoalPilot
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  GoalPilot:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GoalPilot
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Used to schedule your goals around existing events.
        NSHealthShareUsageDescription: Used to count exercise minutes toward your goals.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.goalpilot
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TESTBUILD"
